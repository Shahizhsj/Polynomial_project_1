version: "3.9"

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: rag_backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/qdrant_data:/app/qdrant_data

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: rag_frontend

    ports:
      - "8501:8501"

    depends_on:
      - backend

    restart: unless-stopped